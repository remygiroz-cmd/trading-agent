name: Agent boursier — scans planifiés

# Le déclenchement est désormais piloté par Supabase Cron (minuteur fiable), qui
# appelle la fonction Edge `trigger-agent` -> workflow_dispatch (command "cron").
# Toutes les 15 min en journée (cf. docs/supabase-cron.md). On garde donc
# uniquement le déclenchement manuel/externe ci-dessous. L'ancien bloc `schedule:`
# (cron GitHub, peu fiable) a été retiré pour éviter les doublons.
on:
  workflow_dispatch:           # déclenché par Supabase Cron + manuel (onglet Actions)
    inputs:
      command:
        description: "Commande à lancer (cron, selftest, test-cycle, scan)"
        required: false
        default: "cron"
        type: string

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter (scan ou relève des commandes selon le déclencheur)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
          else
            CMD="cron"
          fi
          echo "Commande : $CMD"
          python main.py "${CMD:-cron}"
