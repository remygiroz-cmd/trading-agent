name: Agent boursier — scans planifiés

# Déclenchements aux horaires des scans (config.SCAN_SCHEDULE, Europe/Paris).
# GitHub Actions utilise l'heure UTC et ne gère pas l'heure d'été : on déclare
# donc les deux décalages (été UTC+2 / hiver UTC+1). Le dispatcher main.py cron
# n'exécute la tâche QUE si l'heure de Paris correspond à un créneau prévu — les
# déclenchements de la "mauvaise" saison sont des no-op instantanés.
on:
  schedule:
    # ── Été (CEST, UTC+2) ──
    - cron: "30 6 * * 1-5"    # 08:30 radar buzz EU
    - cron: "35 7 * * 1-5"    # 09:35 ouverture
    - cron: "30 11 * * 1-5"   # 13:30 mi-journée
    - cron: "0 13 * * 1-5"    # 15:00 radar buzz US
    - cron: "35 15 * * 1-5"   # 17:35 clôture EU
    - cron: "15 20 * * 1-5"   # 22:15 clôture US
    - cron: "30 20 * * 1-5"   # 22:30 bilan quotidien
    - cron: "0 6 * * 1"       # 08:00 lundi : tâches hebdo
    - cron: "0 8 * * 6"       # samedi : permet le récap de fin d'essai buzz
    # ── Hiver (CET, UTC+1) ──
    - cron: "30 7 * * 1-5"    # 08:30 radar buzz EU
    - cron: "35 8 * * 1-5"    # 09:35
    - cron: "30 12 * * 1-5"   # 13:30
    - cron: "0 14 * * 1-5"    # 15:00 radar buzz US
    - cron: "35 16 * * 1-5"   # 17:35
    - cron: "15 21 * * 1-5"   # 22:15
    - cron: "30 21 * * 1-5"   # 22:30 bilan
    - cron: "0 7 * * 1"       # 08:00 lundi
    # ── Relève des commandes Telegram (/paper, boutons…) toutes les 30 min ──
    - cron: "*/30 6-21 * * 1-5"
  workflow_dispatch:           # déclenchement manuel depuis l'onglet Actions
    inputs:
      command:
        description: "Commande à lancer (selftest, cron, test-cycle, scan)"
        required: false
        default: "selftest"
        type: string

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter (scan ou relève des commandes selon le déclencheur)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
          else
            CMD="cron"
          fi
          echo "Commande : $CMD"
          python main.py "${CMD:-cron}"
